name: Build Hex iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - 'sync/**'
      - 'rebuild/**'
    paths:
      - ".github/workflows/build-ios-unsigned.yml"
      - "ios/**"
      - "app/AppIcon.icon/**"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/build-ios-unsigned.yml"
      - "ios/**"
      - "app/AppIcon.icon/**"

permissions:
  contents: read

concurrency:
  # Keep only the newest build for this branch/PR; cancel superseded builds.
  group: ${{ github.workflow }}-${{ github.ref }}-macos26
  cancel-in-progress: true

jobs:
  build:
    name: Archive iOS app and package unsigned IPA
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HEXMobile.xcodeproj \
            -scheme HEXMobile

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal
          metal_path="$(xcrun --find metal)"
          test -x "$metal_path"
          "$metal_path" -v

      - name: Build unsigned iOS archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HEXMobile.xcodeproj \
            -scheme HEXMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hex.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Hex.xcarchive/Products/Applications/HEX.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/HEX.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa"
          echo "IPA_SIZE=$(du -h "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa" | cut -f1)" >> "$GITHUB_ENV"

      - name: Verify IPA contents
        run: |
          unzip -l Hex-iOS-unsigned.ipa | grep -E 'Payload/HEX.app/(Info.plist|PlugIns/.*\.appex/Info.plist)' || true
          echo "Created unsigned IPA: $IPA_SIZE"

      - name: Prepare App Group signing diagnostics
        run: |
          set -euo pipefail
          mkdir -p Signing-Diagnostics
          cp ios/HEXMobile/HEXMobile.entitlements Signing-Diagnostics/Hex-App.entitlements
          cp ios/HEXKeyboard/HEXKeyboard.entitlements Signing-Diagnostics/Hex-Keyboard.entitlements
          cat > Signing-Diagnostics/README.txt <<'EOF'
          Hex Learning Shared Storage - Signing Requirements

          Both the Hex app and Hex Keyboard must be signed with provisioning profiles
          that authorize the SAME App Group:

          group.anomaly.hex.mobile

          Bundle identifiers:
          - App: anomaly.hex.mobile
          - Keyboard extension: anomaly.hex.mobile.keyboard

          When signing the IPA in a signing tool, select profiles for BOTH bundle IDs
          that include the App Groups capability and authorize group.anomaly.hex.mobile.
          The app and keyboard must use compatible certificates/team and profiles.
          Do not remove the application-groups entitlement from either target.

          These entitlement files are templates for signing. They do not grant the
          capability by themselves; Apple's provisioning profile must authorize it.
          EOF
          plutil -lint Signing-Diagnostics/Hex-App.entitlements
          plutil -lint Signing-Diagnostics/Hex-Keyboard.entitlements
          grep -q 'group.anomaly.hex.mobile' Signing-Diagnostics/Hex-App.entitlements
          grep -q 'group.anomaly.hex.mobile' Signing-Diagnostics/Hex-Keyboard.entitlements
          echo "App Group signing requirements verified."

      - name: Upload App Group signing diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Hex-App-Group-Signing-Diagnostics
          path: Signing-Diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hex-iOS-build-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hex-iOS-unsigned-IPA
          path: Hex-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

