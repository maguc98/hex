name: Build Hex iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/build-ios-unsigned.yml"
      - "ios/**"
      - "app/AppIcon.icon/**"

permissions:
  contents: read

concurrency:
  group: hex-ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Archive iOS app and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build the pinned Inputx Pinyin core for iOS
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios --toolchain stable
          git clone --filter=blob:none --no-checkout https://github.com/goliajp/inputx.git "$RUNNER_TEMP/inputx"
          git -C "$RUNNER_TEMP/inputx" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/inputx" sparse-checkout set core tools/eval/runner tools/scoring/data/polish
          git -C "$RUNNER_TEMP/inputx" checkout 622d8651b50877ee63034adc1b4486028aeb6145
          python3 - "$RUNNER_TEMP/inputx/core/crates/inputx-core/src/composite/pinyin_adapter.rs" <<'PY'
          import sys
          from pathlib import Path
          source = Path(sys.argv[1])
          text = source.read_text()
          old = "pub const PINYIN_DISABLE_COMPOSE: bool = true;"
          new = "pub const PINYIN_DISABLE_COMPOSE: bool = false;"
          if old not in text:
              raise SystemExit("Pinned Inputx source no longer matches the expected composition flag")
          source.write_text(text.replace(old, new, 1))
          PY
          cargo +stable build --manifest-path "$RUNNER_TEMP/inputx/core/Cargo.toml" --release --target aarch64-apple-ios -p inputx-core-ffi
          mkdir -p "$GITHUB_WORKSPACE/ios/vendor/inputx"
          ln -s "$RUNNER_TEMP/inputx/core" "$GITHUB_WORKSPACE/ios/vendor/inputx/core"
          test -s "$GITHUB_WORKSPACE/ios/vendor/inputx/core/include/inputx_core.h"
          test -s "$GITHUB_WORKSPACE/ios/vendor/inputx/core/target/aarch64-apple-ios/release/libinputx_core.a"

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HEXMobile.xcodeproj \
            -scheme HEXMobile

      - name: Build unsigned iOS archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project HEXMobile.xcodeproj \
            -scheme HEXMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hex.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Hex.xcarchive/Products/Applications/HEX.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/HEX.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa"
          echo "IPA_SIZE=$(du -h "$GITHUB_WORKSPACE/Hex-iOS-unsigned.ipa" | cut -f1)" >> "$GITHUB_ENV"

      - name: Verify IPA contents
        run: |
          unzip -l Hex-iOS-unsigned.ipa | grep -E 'Payload/HEX.app/(Info.plist|PlugIns/.*\.appex/Info.plist)' || true
          echo "Created unsigned IPA: $IPA_SIZE"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hex-iOS-unsigned-IPA
          path: Hex-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

# Triggered by updates to this workflow on the dev branch.
